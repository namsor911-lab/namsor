name: Firebase Deploy

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT: ${{ secrets.FIREBASE_PROJECT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Copy sample env file
        run: cp .env.example .env

      - name: Inject Firebase project into env
        run: |
          if [ -n "${{ secrets.FIREBASE_PROJECT }}" ]; then
            sed -i "s/^FIREBASE_PROJECT=.*/FIREBASE_PROJECT=${{ secrets.FIREBASE_PROJECT }}/" .env
          fi

      - name: Build Flutter web
        run: flutter build web --release

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase deploy --only hosting --project "$FIREBASE_PROJECT" --token "$FIREBASE_TOKEN"
