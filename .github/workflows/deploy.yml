name: Deploy Flutter Web to GitHub Pages

# Trigger on push to main and manual dispatch
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Required permissions for Pages deployment via Actions
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-gh-pages
      cancel-in-progress: true

    steps:
      # Checkout code with full history
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Cache pub packages to speed up subsequent runs
      - name: Cache Dart Pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      # Set up Flutter (stable)
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'
          channel: 'stable'
          cache: true

      # Ensure web is enabled
      - name: Enable web platform
        run: flutter config --enable-web

      # Install dependencies
      - name: Get dependencies
        run: flutter pub get

      # Build web using the required base-href for the 'namsor' repo
      - name: Build Flutter web (release)
        run: flutter build web --release --base-href "/namsor/"

      # Prepare GitHub Pages environment
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v2

      # Upload the build output (must point to build/web)
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: build/web

      # Deploy the uploaded artifact to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
